<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameCLI · UI Studio</title><!-- STUDIO_STYLE --></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">G</span> UI Studio <span id="dirty" class="dirty" hidden>未保存</span></div><div class="top-actions"><span id="project-label" title="当前工程">工程：GameCLI</span><span id="connection">连接中</span><button id="expand" hidden>展开 ↗</button><button id="import">导入</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="export" disabled>导出</button><button id="preview-back" hidden>返回</button><button id="preview-reset" hidden>重置预演</button><button id="preview" aria-pressed="false">预演</button><button id="sync" title="将选中的系统更新到基础模板库" disabled>同步</button><button id="save" class="primary" disabled>保存</button></div></header>
<main class="editor">
<aside class="layers"><div class="section-title">节点 <span id="node-count">0</span></div><button id="root-node" class="root-node" title="Canvas · 固定根节点"><span>▣</span><strong id="design-title">Canvas</strong></button><div id="tree" role="tree" aria-label="最终节点层级"></div><details id="inspector"><summary>节点属性 <span id="selected-type">—</span></summary><div id="empty-selection" class="empty">选择节点以编辑</div><form id="properties" hidden><label>名称<input id="field-id" name="id" autocomplete="off" maxlength="64"></label><div class="field-grid"><label>X<input id="field-x" type="number"></label><label>Y<input id="field-y" type="number"></label><label>宽<input id="field-width" type="number" min="1" max="8192"></label><label>高<input id="field-height" type="number" min="1" max="8192"></label></div><label>颜色<input id="field-color" type="color"></label><label>不透明度<input id="field-opacity" type="number" min="0" max="1" step="0.05"></label><label hidden>边框宽度<input id="field-borderWidth" type="number" min="0" max="64"></label><label>文本<textarea id="field-text" rows="2" maxlength="2000"></textarea></label><label>字号<input id="field-fontSize" type="number" min="8" max="128"></label><label id="progress-property" hidden>进度（%）<input id="field-progress" type="number" min="0" max="100" step="1"></label><label>点击动作<select id="field-action"><option value="auto">默认反馈</option><option value="none">无动作</option><option value="show">显示界面 / 弹窗</option><option value="hide">关闭目标</option><option value="toggle">切换显示</option><option value="navigate">跳转到界面（隐藏同级面板）</option><option value="back">返回上一步</option></select></label><label id="action-target-label" hidden>目标节点<select id="field-action-target"></select></label><label><input id="field-preview-hidden" type="checkbox">预演开始时隐藏</label><button type="button" id="delete" class="danger">删除节点</button></form><label>设计文件名<input id="design-name" maxlength="64"></label></details></aside>
<section class="canvas-area" aria-label="手机设计画布"><div class="canvas-toolbar"><div class="studio-tabs" role="tablist" aria-label="工作区分页"><button id="tab-edit" role="tab" aria-selected="true" aria-controls="viewport">编辑</button><button id="tab-relations" role="tab" aria-selected="false" aria-controls="relations-view">关系</button></div><select id="preset" aria-label="手机分辨率"><option value="1080x1920">1080 × 1920 · 9:16</option><option value="1080x2400">1080 × 2400 · 9:20</option><option value="1170x2532">1170 × 2532 · 手机</option><option value="custom" disabled>自定义尺寸</option></select><button id="rotate" title="切换横竖屏" aria-label="切换横竖屏">↻</button></div><div id="relations-tools" hidden><span id="relations-count"></span><span>拖动卡片标题排列 · 拖动圆点连线</span></div><div id="relations-view" role="tabpanel" aria-label="UI 关系图" hidden><div id="relations-plane"><svg id="relations-wires" aria-label="UI 跳转连线"></svg><div id="relations-cards"></div><p id="relations-empty">还没有 UI。请在编辑页添加系统模板。</p></div></div><div id="relations-info" hidden></div><div class="canvas-viewport" id="viewport" role="tabpanel" aria-label="UI 编辑画布"><div id="canvas-wrap"><div id="canvas"></div></div></div><div class="canvas-footer"><div id="preview-progress" hidden></div><span id="resolution">1080 × 1920</span><div><button id="undo" title="撤销" disabled>↶</button><button id="fit" title="等比适应画布"><span id="zoom">100%</span></button></div></div></section>
<aside class="palette"><div class="section-title">标准控件 <span>UGUI</span></div><p class="palette-hint">拖入手机画布</p><div class="control-list">
<button class="control" data-control="Container" aria-label="拖入面板"><span class="control-icon">▣</span><span>面板<small>Panel</small></span></button>
<button class="control" data-control="Text" aria-label="拖入文本"><span class="control-icon">T</span><span>文本<small>Text</small></span></button>
<button class="control" data-control="Image" aria-label="拖入图片"><span class="control-icon">▧</span><span>图片<small>Image</small></span></button>
<button class="control" data-control="Button" aria-label="拖入按钮"><span class="control-icon">▭</span><span>按钮<small>Button</small></span></button>
</div><div id="template-library"><p class="palette-note">正在加载模板库…</p></div><div class="palette-note">系统模板拖入后生成完整节点组。<br><br>拖入容器可嵌套。<br>单击控件可居中添加。<br><br>双击节点编辑属性。<br><br>Delete 删除选中控件<br>方向键移动 1 px<br>Shift＋方向键 10 px</div><div class="unity-state">○ Unity 未连接</div></aside>
</main><div id="notice" role="status" aria-live="polite">正在加载设计…</div><div id="drag-ghost" hidden></div><!-- STUDIO_SCRIPT --></body></html>
